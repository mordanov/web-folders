name: Publish Telegram prototype

on:
  push:
    branches: [main]
    paths:
      - prototypes/telegram/**
      - .github/workflows/publish-telegram-prototype.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-telegram-prototype-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/telegram
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Ensure media tools are available
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null || ! command -v file >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg file
          fi
      - run: uv sync --frozen
      - name: Validate prototype
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy bot.py tests
          uv run pytest -q
          uv export --frozen --no-dev --no-emit-project --no-header --no-annotate --format requirements-txt --output-file /tmp/telegram-requirements.txt --quiet
          diff requirements.txt /tmp/telegram-requirements.txt
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested x86-64 image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: prototypes/telegram
          platforms: linux/amd64
          push: true
          tags: ghcr.io/mordanov/solfeo-telegram-prototype:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/mordanov/solfeo-exercises
      - name: Record publication
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'Image: `ghcr.io/mordanov/solfeo-telegram-prototype@%s`\n\n' "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          printf 'Activation requires a dedicated bot token and an explicit sender allowlist on the VPS.\n' >> "$GITHUB_STEP_SUMMARY"
